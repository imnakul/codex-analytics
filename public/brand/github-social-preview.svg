<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Codex Analytics Ledger</title>
  <desc id="desc">Local-only analytics for ChatGPT Codex work.</desc>
  <defs>
    <linearGradient id="shade" x1="0" x2="1">
      <stop offset="0" stop-color="#10120e"/>
      <stop offset=".52" stop-color="#10120e" stop-opacity=".94"/>
      <stop offset="1" stop-color="#10120e" stop-opacity=".1"/>
    </linearGradient>
    <clipPath id="clip"><rect width="1280" height="640" rx="0"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <image href="launch-background.jpg" width="1280" height="720" preserveAspectRatio="xMidYMid slice"/>
    <rect width="1280" height="640" fill="url(#shade)"/>
    <image href="app-icon.svg" x="64" y="56" width="88" height="88"/>
    <g font-family="Arial, Helvetica, sans-serif">
      <text x="72" y="215" fill="#f1ecdf" font-size="64" font-weight="700" letter-spacing="-2.8">Codex Analytics</text>
      <text x="72" y="276" fill="#8e9383" font-size="34" font-weight="700" letter-spacing="8">LEDGER</text>
      <text x="72" y="365" fill="#d8d4c9" font-size="28">Understand your ChatGPT Codex work.</text>
      <text x="72" y="406" fill="#8e9383" font-size="23">Threads · models · runtime · tokens · cost</text>
      <rect x="72" y="468" width="198" height="46" fill="#d7ff5f"/>
      <text x="91" y="499" fill="#172000" font-size="17" font-weight="700" letter-spacing="1.3">LOCAL-ONLY</text>
      <rect x="282" y="468" width="224" height="46" fill="#171914" stroke="#4a4f41"/>
      <text x="303" y="499" fill="#f1ecdf" font-size="17" font-weight="700" letter-spacing="1">OPEN SOURCE</text>
      <text x="72" y="576" fill="#676c5e" font-size="16">Community project · Not affiliated with or endorsed by OpenAI</text>
    </g>
  </g>
</svg>
