      <g font-size="11"><text x="16" y="101" fill="#e5e0d4">Review current changes</text><text x="273" y="101" fill="#a9d1ff">5.6 Sol</text><text x="374" y="101" fill="#c9c5b9">2.8M</text><text x="438" y="101" fill="#d7ff5f">$8.42</text>
