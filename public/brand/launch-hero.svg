    <rect x="0" y="0" width="790" height="58" rx="10" fill="#171914"/>
    <circle cx="24" cy="29" r="5" fill="#ff8067"/><circle cx="43" cy="29" r="5" fill="#d7ff5f"/><circle cx="62" cy="29" r="5" fill="#88bfff"/>
