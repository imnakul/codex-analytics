    <text x="90" y="325" fill="#f1ecdf" font-size="76" font-weight="700" letter-spacing="-3.6">measured.</text>
    <text x="90" y="380" fill="#8e9383" font-size="30">No model call required.</text>
    <text x="90" y="467" fill="#d8d4c9" font-size="25">A privacy-first, local-only dashboard for</text>
    <text x="90" y="504" fill="#d8d4c9" font-size="25">ChatGPT Codex threads, models, time and cost.</text>
    <rect x="90" y="567" width="224" height="54" fill="#d7ff5f"/>
    <text x="117" y="603" fill="#172000" font-size="18" font-weight="700" letter-spacing="1.4">OPEN SOURCE</text>
    <text x="90" y="778" fill="#676c5e" font-size="15">Community project · Not affiliated with or endorsed by OpenAI</text>
  </g>
