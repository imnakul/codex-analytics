<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Codex Analytics Ledger launch hero</title>
  <desc id="desc">A dark launch image showing the local-only Codex analytics product and an illustrative dashboard preview.</desc>
  <defs>
    <linearGradient id="overlay" x1="0" x2="1"><stop offset="0" stop-color="#10120e"/><stop offset=".58" stop-color="#10120e" stop-opacity=".88"/><stop offset="1" stop-color="#10120e" stop-opacity=".44"/></linearGradient>
    <filter id="panelShadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="28" stdDeviation="28" flood-color="#000" flood-opacity=".5"/></filter>
  </defs>
  <image href="launch-background.jpg" width="1600" height="900" preserveAspectRatio="xMidYMid slice"/>
  <rect width="1600" height="900" fill="url(#overlay)"/>
  <image href="app-icon.svg" x="78" y="72" width="98" height="98"/>
  <g font-family="Arial, Helvetica, sans-serif">
