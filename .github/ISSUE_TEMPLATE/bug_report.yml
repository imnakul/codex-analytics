name: Bug report
description: Report a reproducible problem using sanitized information.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not attach Codex databases, transcripts, prompts, credentials, usernames, or absolute machine paths. Report security vulnerabilities privately through the Security tab.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Codex Analytics Ledger version
      placeholder: 0.1.0 or commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Sanitized operating system, Node.js version, and Codex version.
      placeholder: Windows 11, Node 24.x, Codex x.y.z
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide minimal steps using synthetic data only.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove prompts, credentials, usernames, IDs, and absolute paths.
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed all personal data, credentials, prompts, transcripts, and machine-specific paths.
          required: true
